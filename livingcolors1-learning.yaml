# Learning lights by pairing or with the remote control, ESP32 only
button:
  - id: !extend livingcolors1_buttons
    learn:
      id: livingcolors1_learn_button
      name: "Learn LivingColors"

# Lights without address get theirs when pairing or learning and stay hidden until then.
# The address is stored by id, so keep the ids; the names can be changed.
light:
  - platform: livingcolors1
    id: livingcolors1_light_1
    name: "LivingColors 1"
    restore_mode: RESTORE_DEFAULT_OFF
